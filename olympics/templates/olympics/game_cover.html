<div class="game-cover">
  <svg aria-hidden="true" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2">
    <rect x="12" y="12" width="40" height="40" rx="8" transform="rotate(-12 32 32)"/>
    <circle cx="23" cy="24" r="2"/><circle cx="32" cy="32" r="2"/><circle cx="41" cy="40" r="2"/>
  </svg>
  {% if game.cover_url %}
    <img src="{{ game.cover_url }}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" onerror="this.hidden = true">
  {% endif %}
</div>
