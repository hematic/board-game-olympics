{% extends "olympics/base.html" %}
{% block title %}Sign in | Board Game Olympics{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p>Use the username and password your organizer gave you.</p>
<form method="post">
  {% csrf_token %}
  {{ form }}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Sign in</button>
</form>
{% endblock %}
