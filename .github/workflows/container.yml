name: Test and build container

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-deployment-secret
      POCKET_ID_ISSUER: https://id.example.invalid
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test
      - run: docker build --tag olympics-ci .
      - name: Smoke-test image and database volume
        run: |
          docker volume create olympics-ci-data
          docker run --rm --env DJANGO_SECRET_KEY --env POCKET_ID_ISSUER \
            --volume olympics-ci-data:/data olympics-ci python manage.py migrate --noinput
          docker run --detach --name olympics-ci --env DJANGO_SECRET_KEY --env POCKET_ID_ISSUER \
            --volume olympics-ci-data:/data olympics-ci
          docker exec -i olympics-ci python - <<'PY'
          import time
          import urllib.error
          import urllib.request

          base = "http://127.0.0.1:8000"
          for attempt in range(20):
              try:
                  with urllib.request.urlopen(base + "/healthz/", timeout=1) as response:
                      assert response.read() == b"ok\n"
                  break
              except urllib.error.URLError:
                  if attempt == 19:
                      raise
                  time.sleep(1)

          request = urllib.request.Request(
              base + "/", headers={"X-Forwarded-Proto": "https", "Remote-Sub": "ci-member"}
          )
          with urllib.request.urlopen(request, timeout=2) as response:
              assert b"Signed in as a member" in response.read()
          PY
      - name: Verify SQLite backup restores to a fresh volume
        run: |
          docker exec olympics-ci python -c 'import sqlite3; source = sqlite3.connect("file:/data/olympics.sqlite3?mode=ro", uri=True); target = sqlite3.connect("/tmp/backup.sqlite3"); source.backup(target); target.close(); source.close()'
          docker volume create olympics-ci-restore
          docker exec olympics-ci cat /tmp/backup.sqlite3 > "$RUNNER_TEMP/olympics-ci.sqlite3"
          docker run --rm -i --volume olympics-ci-restore:/data olympics-ci \
            sh -c 'set -C; cat > /data/olympics.sqlite3' < "$RUNNER_TEMP/olympics-ci.sqlite3"
          docker run --rm --volume olympics-ci-restore:/data olympics-ci \
            python -c 'import sqlite3; db = sqlite3.connect("file:/data/olympics.sqlite3?mode=ro", uri=True); assert db.execute("PRAGMA integrity_check").fetchone() == ("ok",); assert db.execute("SELECT subject FROM olympics_member").fetchone() == ("ci-member",)'
      - name: Print container logs on failure
        if: failure()
        run: |
          if docker container inspect olympics-ci >/dev/null 2>&1; then
            docker logs olympics-ci
          fi
      - name: Publish version to Docker Hub
        if: github.event_name == 'release' && !github.event.release.prerelease
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tags must look like v1.2.3."
            exit 1
          fi
          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Set the DOCKERHUB_TOKEN Actions secret before publishing."
            exit 1
          fi
          printf '%s' "$DOCKERHUB_TOKEN" | docker login --username hematic --password-stdin
          image="hematic/board-game-olympics:$VERSION"
          docker tag olympics-ci "$image"
          docker push "$image"
